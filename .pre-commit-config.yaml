ci:
  autoupdate_commit_msg: "chore(deps): update pre-commit hooks"
  autofix_commit_msg: "style: pre-commit fixes"
  autoupdate_schedule: "monthly"

exclude: ^.cruft.json|.copier-answers.yml$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "3e8a8703264a2f4a69428a0aa4dcb512790b2c8c" # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: name-tests-test
        args: ["--pytest-test-first"]
      - id: requirements-txt-fixer
      - id: trailing-whitespace

  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: "3a6eb0fadf60b3cccfd80bad9dbb6fae7e47b316" # frozen: v1.10.0
    hooks:
      - id: rst-backticks
      - id: rst-directive-colons
      - id: rst-inline-touching-normal

  - repo: https://github.com/rbubley/mirrors-prettier
    rev: "ef4a397f916211b4a39ccf9d3d9cbb6562157251" # frozen: v3.9.9
    hooks:
      - id: prettier
        types_or: [yaml, markdown, html, css, scss, javascript, json]
        args: [--prose-wrap=always]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "2eeb5678de71a00c0902cbda7105d328432f72cb" # frozen: v0.16.8
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format
        types_or: [python, pyi, jupyter, markdown, pyproject]

  # - repo: https://github.com/pre-commit/mirrors-mypy
  #   rev: "v2.3.1"
  #   hooks:
  #     - id: mypy
  #       files: src|tests|noxfile.py
  #       args: []
  #       additional_dependencies:
  #         - nox
  #         - pytest

  - repo: https://github.com/codespell-project/codespell
    rev: "57b21406f092110c18776e39b0bda50d37c945c8" # frozen: v2.4.3
    hooks:
      - id: codespell
        additional_dependencies:
          - tomli; python_version<'3.11'

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: "a6564f5d57444e123433a5c9af733e3975c77229" # frozen: v0.11.0.1-1
    hooks:
      - id: shellcheck

  # - repo: local
  #   hooks:
  #     - id: disallow-caps
  #       name: Disallow improper capitalization
  #       language: pygrep
  #       entry: PyBind|Numpy|Cmake|CCache|Github|PyTest|OISST|NOAA|OISST_S3_BUCKET|OISST_S3_PREFIX|OISST_S3_REGION|OISST_S3_ENDPOINT|OISST_S3_ACL|SOURCE_COOP_SERVICE_ACCOUNT
  #       exclude: .pre-commit-config.yaml

  - repo: https://github.com/henryiii/validate-pyproject-schema-store/
    rev: "562b381732c1d2bec9a3a66cc89f63e16d486470" # frozen: 2026.09.30
    hooks:
      - id: validate-pyproject

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: "0494aa7fa1314e98913a41227d8f0a515b2c1049" # frozen: 0.38.2
    hooks:
      - id: check-dependabot
      - id: check-github-workflows
      - id: check-readthedocs

  - repo: https://github.com/rhysd/actionlint
    rev: "914e7df21a07ef503a81201c76d2b11c789d3fca" # frozen: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: "fa412071e4f5d44d44f9e365f4676f9df92456a2" # frozen: v1.30.1
    hooks:
      - id: zizmor
        files: "^\\.github"
        args: [--persona=pedantic]

update:
  freeze: true
  cooldown_days: 7
