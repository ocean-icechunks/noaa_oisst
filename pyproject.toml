[build-system]
requires = ["uv_build>=0.12.22,<0.13"]
build-backend = "uv_build"


[project]
name = "ohw26_oisst_icechunk"
version = "0.1.0"
authors = [
  { name = "Alex Kerney", email = "abk@mac.com" },
]
description = "Use Github Actions to keep an icechunk of virtual references to OISST data up to date."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
# Pin to match [tool.pixi.dependencies] so uv-based installs (CI) resolve the
# same icechunk release the production pixi environment runs.
dependencies = [
  "icechunk >=2.2.2,<3",
  "zarr >=3.4,<3.5",
  "xarray >=2025.7.0",
  "virtualizarr >=2,<3",
  "numpy >=2",
  "s3fs >=2024.6.1",
  "fsspec >=2024.6.1",
  # HDF/NetCDF parsing for VirtualiZarr's HDFParser (h5py is a hard
  # requirement of the parser - Stage 0 finding)
  "h5netcdf >=1.3.0",
  "h5py >=3.11",
  "hdf5plugin >=4",
  # VirtualiZarr 2.x object-store registry
  "obstore >=0.5",
  "obspec-utils >=0.1",
  "typer >=0.12",
]

[project.scripts]
oisst = "ohw26_oisst_icechunk.cli:main"

[project.urls]
Homepage = "https://github.com/oceanhackweek/ohw26_oisst_icechunk"
"Bug Tracker" = "https://github.com/oceanhackweek/ohw26_oisst_icechunk/issues"
Discussions = "https://github.com/oceanhackweek/ohw26_oisst_icechunk/discussions"
Changelog = "https://github.com/oceanhackweek/ohw26_oisst_icechunk/releases"


[dependency-groups]
test = [
  "pytest >=9",
  "pytest-cov >=7",
]
dev = [
  { include-group = "test" },
  "marimo",
]
docs = [
    "zensical>=0.0.20",
]


[tool.pytest]
minversion = "9.0"
# Network-marked tests hit NOAA's anonymous bucket; run them explicitly with
# `pytest -m network`.
addopts = ["-ra", "--showlocals", "-m", "not network"]
strict = true
markers = [
  "network: requires internet access to NOAA's public S3 bucket",
]
filterwarnings = [
  "error",
  # NOAA's NetCDFs are deflate-compressed; the virtual arrays carry a
  # numcodecs zlib codec that zarr-python warns is outside the Zarr v3 spec.
  "ignore:Numcodecs codecs are not in the Zarr version 3 specification:UserWarning",
  # xarray warns when encoding attrs (scale_factor etc.) ride along on variables
  "ignore::xarray.coding.variables.SerializationWarning",
]
log_level = "INFO"
testpaths = [
  "tests",
]


[tool.coverage]
run.source = ["ohw26_oisst_icechunk"]
report.exclude_also = [
  '\.\.\.',
  'if typing.TYPE_CHECKING:',
]

[tool.mypy]
files = ["src", "tests"]
python_version = "3.12"
warn_unused_configs = true
strict = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
warn_unreachable = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = "ohw26_oisst_icechunk.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true
# The data stack's dynamic returns (sessions, snapshots) surface as Any.
warn_return_any = false

[[tool.mypy.overrides]]
module = [
  "fsspec.*",
  "h5py.*",
  "obspec_utils.*",
  "obstore.*",
  "s3fs.*",
  "virtualizarr.*",
]
ignore_missing_imports = true


[tool.ruff]
show-fixes = true

[tool.ruff.lint]
extend-select = [
  "ARG",    # flake8-unused-arguments
  "B",      # flake8-bugbear
  "C4",     # flake8-comprehensions
  "EM",     # flake8-errmsg
  "EXE",    # flake8-executable
  "FURB",   # refurb
  "G",      # flake8-logging-format
  "ICN",    # flake8-import-conventions
  "ISC",    # flake8-implicit-str-concat
  "LOG",    # flake8-logging
  "NPY",    # NumPy specific rules
  "PD",     # pandas-vet
  "PERF",   # perflint
  "PGH",    # pygrep-hooks
  "PL",     # pylint
  "PT",     # flake8-pytest-style
  "PTH",    # flake8-use-pathlib
  "PYI",    # flake8-pyi
  "Q",      # flake8-quotes
  "RET",    # flake8-return
  "RSE",    # flake8-raise
  "RUF",    # Ruff-specific
  "SIM",    # flake8-simplify
  "SLOT",   # flake8-slots
  "T10",    # flake8-debugger
  "T20",    # flake8-print
  "TC",     # flake8-type-checking
  "TRY",    # tryceratops
  "UP",     # pyupgrade
]
ignore = [
  "PLR09",    # Too many <...>
  "PLR2004",  # Magic value used in comparison
]
# Uncomment if using a _compat.typing backport
# typing-modules = ["ohw26_oisst_icechunk._compat.typing"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]
"noxfile.py" = ["T20"]


[tool.pylint]
py-version = "3.12"
ignore-paths = [".*/_version.py"]
reports.output-format = "colorized"
similarities.ignore-imports = "yes"
messages_control.disable = [
  "design",
  "fixme",
  "line-too-long",
  "missing-module-docstring",
  "missing-function-docstring",
  "wrong-import-position",
]

[tool.uv]
exclude-newer = "3 days"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]
exclude-newer = "3d"

[tool.pixi.dependencies]
python = ">=3.12,<3.14"
icechunk = ">=2.2.2,<3"
zarr = ">=3.4,<3.5"
xarray = ">=2025.7.0"
virtualizarr = ">=2,<3"
numpy = ">=2"
s3fs = ">=2024.6.1"
fsspec = ">=2024.6.1"
h5netcdf = ">=1.3.0"
h5py = ">=3.11"
hdf5plugin = ">=4"
typer = ">=0.12"
arraylake = ">=1.2.0,<2"

[tool.pixi.pypi-dependencies]
ohw26_oisst_icechunk = { path = ".", editable = true }
obstore = ">=0.5"
obspec-utils = ">=0.1"

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }
test = { features = ["test"], solve-group = "default" }

[tool.pixi.tasks]
sync-source-coop = "aws s3 sync ./local-store s3://ocean-icechunks/noaa-oisst/ --profile source-coop --exclude \"*/.*\" --exclude \".*\" --acl bucket-owner-full-control"
oisst-source-coop = "AWS_PROFILE=source-coop OISST_S3_BUCKET=ocean-icechunks OISST_S3_PREFIX=noaa-oisst/oisst.icechunk OISST_S3_ENDPOINT=https://data.source.coop pixi run oisst"
